[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxguard-contracts"
version = "0.1.0"
description = "Shared contracts for VoxGuard services — event envelope, error format, correlation ID."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["voxguard_contracts"]
