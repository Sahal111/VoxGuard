[build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

    [project]
    name = "voxguard-audit-service"
    version = "0.1.0"
    description = "VoxGuard audit-service"
    requires-python = ">=3.10"
    dependencies = [
        "fastapi>=0.115,<1",
        "uvicorn[standard]>=0.32,<1",
        "pydantic-settings>=2.6,<3",
        "httpx>=0.27,<1",
"sqlalchemy[asyncio]>=2.0,<3",
"asyncpg>=0.29,<1",
"alembic>=1.13,<2",
"psycopg2-binary>=2.9,<3",
    ]

    [project.optional-dependencies]
    dev = [
        "pytest>=8.0,<9",
        "pytest-asyncio>=0.24,<1",
        "httpx>=0.27,<1",
    ]

[tool.pytest.ini_options]
asyncio_mode = "auto"
